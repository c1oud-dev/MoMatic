<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>회의록 상세</title>
  <meta name="_csrf" th:content="${_csrf.token}" />
  <meta name="_csrf_header" th:content="${_csrf.headerName}" />
  <style>
    .status-badge {
        border-radius: 999px;
        display: inline-block;
        padding: 0.2rem 0.6rem;
    }
    .status-pending,
    .status-processing {
        background: #fff3cd;
    }
    .status-completed {
        background: #d1e7dd;
    }
    .status-failed {
        background: #f8d7da;
    }
    .action-item-fields,
    .action-item-controls {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin: 0.5rem 0;
    }
    .action-item-edit-form {
        margin-top: 0.5rem;
    }
  </style>
</head>
<body>
<div th:replace="~{layouts/default :: layout(~{::section})}">
  <section>
    <header>
      <a th:href="@{/meetings}">목록으로</a>
      <div>
        <h1 id="meeting-title" th:text="${detail.meeting.title}">회의 제목</h1>
        <button th:if="${canManage}" id="title-edit-button" type="button">제목 편집</button>
      </div>
      <form th:if="${canManage}" id="title-edit-form" hidden>
        <label for="meeting-title-input">회의록 제목</label>
        <input id="meeting-title-input"
               name="title"
               type="text"
               th:value="${detail.meeting.title}"
               required />
        <button type="submit">저장</button>
        <button id="title-edit-cancel-button" type="button">취소</button>
      </form>
      <p th:if="${canManage}" id="title-edit-result" role="alert" aria-live="polite"></p>
      <a th:href="@{/meetings/{meetingId}/pdf(meetingId=${detail.meeting.id})}">PDF 다운로드</a>
      <button th:if="${canManage}" id="meeting-delete-button" type="button">회의록 삭제</button>
      <p th:if="${canManage}" id="meeting-delete-result" role="alert" aria-live="polite"></p>
      <span th:text="${detail.meeting.status}"
            th:class="|status-badge status-${#strings.toLowerCase(detail.meeting.status.name())}|">
                COMPLETED
            </span>
    </header>

    <section>
      <h2>요약</h2>
      <p th:if="${#strings.isEmpty(detail.meeting.summary)}">아직 생성된 요약이 없습니다.</p>
      <p th:unless="${#strings.isEmpty(detail.meeting.summary)}"
         th:text="${detail.meeting.summary}">회의 요약</p>
    </section>

    <section>
      <h2>전사 내용</h2>
      <p th:if="${#lists.isEmpty(detail.transcripts)}">아직 생성된 전사 내용이 없습니다.</p>
      <ol th:unless="${#lists.isEmpty(detail.transcripts)}">
        <li th:each="transcript : ${detail.transcripts}">
          <strong th:text="${transcript.speaker}">화자</strong>
          <span th:text="${transcript.content}">전사 내용</span>
        </li>
      </ol>
    </section>

    <section>
      <h2>액션 아이템</h2>
      <p th:if="${canManage and !calendarAvailable}">
        Google Calendar 신규 일정 등록은 Pro 이상 플랜에서 사용할 수 있습니다.
        <a th:href="@{/plans}">플랜 확인</a>
      </p>
      <button th:if="${canManage}" id="action-item-create-button" type="button">새 액션 아이템 추가</button>
      <form th:if="${canManage}" id="action-item-create-form" hidden>
        <div class="action-item-fields">
          <label>
            내용
            <input name="task" type="text" required />
          </label>
          <label>
            담당자
            <input name="assignee" type="text" />
          </label>
          <label>
            마감일
            <input name="dueDate" type="date" />
          </label>
        </div>
        <button type="submit">추가</button>
        <button class="action-item-create-cancel" type="button">취소</button>
      </form>
      <p th:if="${canManage}" id="action-item-result" role="alert" aria-live="polite"></p>
      <p id="action-item-empty" th:hidden="${!#lists.isEmpty(detail.actionItems)}">
        등록된 액션 아이템이 없습니다.
      </p>
      <ul id="action-item-list" th:hidden="${#lists.isEmpty(detail.actionItems)}">
        <li class="action-item" th:each="actionItem : ${detail.actionItems}"
            th:data-action-item-id="${actionItem.id}">
          <div class="action-item-view">
            <span class="action-item-task" th:text="${actionItem.task}">할 일</span>
            <span class="action-item-assignee"
                  th:hidden="${#strings.isEmpty(actionItem.assignee)}"
                  th:text="|담당: ${actionItem.assignee}|">담당자</span>
            <time class="action-item-due-date"
                  th:hidden="${actionItem.dueDate == null}"
                  th:datetime="${actionItem.dueDate}"
                  th:text="|마감일: ${actionItem.dueDate}|">마감일: 2026-06-01</time>
            <div th:if="${canManage}" class="action-item-controls">
              <select class="action-item-status"
                      th:data-action-item-id="${actionItem.id}"
                      aria-label="액션 아이템 상태">
                <option th:each="status : ${ {'TODO', 'IN_PROGRESS', 'DONE'} }"
                        th:value="${status}"
                        th:text="${status}"
                        th:selected="${status == actionItem.status}">TODO</option>
              </select>
              <button class="calendar-event-button"
                      type="button"
                      th:disabled="${actionItem.calendarEventRegistered
                          || !calendarAvailable}"
                      th:text="${actionItem.calendarEventRegistered}
                          ? '캘린더 등록 완료'
                          : (${calendarAvailable} ? '캘린더 등록' : 'Pro 이상 플랜 필요')">
                캘린더 등록
              </button>
              <button class="action-item-edit-button" type="button">편집</button>
              <button class="action-item-delete-button" type="button">삭제</button>
            </div>
          </div>
          <form th:if="${canManage}" class="action-item-edit-form" hidden>
            <div class="action-item-fields">
              <label>
                내용
                <input name="task" type="text" th:value="${actionItem.task}" required />
              </label>
              <label>
                담당자
                <input name="assignee" type="text" th:value="${actionItem.assignee}" />
              </label>
              <label>
                마감일
                <input name="dueDate" type="date" th:value="${actionItem.dueDate}" />
              </label>
            </div>
            <button type="submit">저장</button>
            <button class="action-item-edit-cancel" type="button">취소</button>
          </form>
          <p th:if="${canManage}" class="action-item-row-result" role="alert" aria-live="polite"></p>
        </li>
      </ul>
    </section>
  </section>
</div>
<script th:if="${canManage}" th:inline="javascript">
  const meetingId = /*[[${detail.meeting.id}]]*/ 0;
  const calendarAvailable = /*[[${calendarAvailable}]]*/ false;
  const csrfToken = document.querySelector('meta[name="_csrf"]').content;
  const csrfHeader = document.querySelector('meta[name="_csrf_header"]').content;
  const meetingTitle = document.getElementById('meeting-title');
  const titleEditButton = document.getElementById('title-edit-button');
  const titleEditForm = document.getElementById('title-edit-form');
  const titleInput = document.getElementById('meeting-title-input');
  const titleEditCancelButton = document.getElementById('title-edit-cancel-button');
  const titleEditResult = document.getElementById('title-edit-result');
  const meetingDeleteButton = document.getElementById('meeting-delete-button');
  const meetingDeleteResult = document.getElementById('meeting-delete-result');
  const actionItemCreateButton = document.getElementById('action-item-create-button');
  const actionItemCreateForm = document.getElementById('action-item-create-form');
  const actionItemResult = document.getElementById('action-item-result');
  const actionItemEmpty = document.getElementById('action-item-empty');
  const actionItemList = document.getElementById('action-item-list');

  function actionItemPayload(form) {
    const formData = new FormData(form);
    return {
      task: formData.get('task').trim(),
      assignee: formData.get('assignee').trim() || null,
      dueDate: formData.get('dueDate') || null
    };
  }

  async function requestJson(url, options) {
    const response = await fetch(url, options);
    const result = await response.json();

    if (!response.ok || !result.success) {
    if (result.errorCode === 'CALENDAR_PLAN_REQUIRED') {
        throw new Error(
          '구독이 종료되어 캘린더 신규 등록이 제한됩니다. Pro 이상 플랜을 이용해 주세요.'
        );
      }
      throw new Error(result.message || '요청을 처리하지 못했습니다.');
    }
    return result.data;
  }

  function updateEmptyState() {
    const isEmpty = !actionItemList.querySelector('.action-item');
    actionItemEmpty.hidden = !isEmpty;
    actionItemList.hidden = isEmpty;
  }

  function updateActionItemView(item, payload) {
    item.querySelector('.action-item-task').textContent = payload.task;
    const assignee = item.querySelector('.action-item-assignee');
    assignee.textContent = payload.assignee ? `담당: ${payload.assignee}` : '';
    assignee.hidden = !payload.assignee;
    const dueDate = item.querySelector('.action-item-due-date');
    dueDate.textContent = payload.dueDate ? `마감일: ${payload.dueDate}` : '';
    dueDate.dateTime = payload.dueDate || '';
    dueDate.hidden = !payload.dueDate;
  }

  function createActionItemElement(actionItem) {
    const template = document.createElement('template');
    template.innerHTML = `
      <li class="action-item" data-action-item-id="${actionItem.id}">
        <div class="action-item-view">
          <span class="action-item-task"></span>
          <span class="action-item-assignee"></span>
          <time class="action-item-due-date"></time>
          <div class="action-item-controls">
            <select class="action-item-status" data-action-item-id="${actionItem.id}"
                    aria-label="액션 아이템 상태">
              <option value="TODO">TODO</option>
              <option value="IN_PROGRESS">IN_PROGRESS</option>
              <option value="DONE">DONE</option>
            </select>
            <button class="calendar-event-button"
                    type="button"
                    ${calendarAvailable ? '' : 'disabled'}>
              ${calendarAvailable ? '캘린더 등록' : 'Pro 이상 플랜 필요'}
            </button>
            <button class="action-item-edit-button" type="button">편집</button>
            <button class="action-item-delete-button" type="button">삭제</button>
          </div>
        </div>
        <form class="action-item-edit-form" hidden>
          <div class="action-item-fields">
            <label>내용 <input name="task" type="text" required /></label>
            <label>담당자 <input name="assignee" type="text" /></label>
            <label>마감일 <input name="dueDate" type="date" /></label>
          </div>
          <button type="submit">저장</button>
          <button class="action-item-edit-cancel" type="button">취소</button>
        </form>
        <p class="action-item-row-result" role="alert" aria-live="polite"></p>
      </li>`;
    const item = template.content.firstElementChild;
    const form = item.querySelector('.action-item-edit-form');
    form.elements.task.value = actionItem.task;
    form.elements.assignee.value = actionItem.assignee || '';
    form.elements.dueDate.value = actionItem.dueDate || '';
    item.querySelector('.action-item-status').value = actionItem.status;
    updateActionItemView(item, actionItem);
    bindActionItem(item);
    return item;
  }

  function closeTitleEditForm() {
    titleEditForm.hidden = true;
    titleEditButton.hidden = false;
  }

  titleEditButton.addEventListener('click', () => {
    titleEditForm.hidden = false;
    titleEditButton.hidden = true;
    titleEditResult.textContent = '';
    titleInput.focus();
    titleInput.select();
  });

  titleEditCancelButton.addEventListener('click', () => {
    titleInput.value = meetingTitle.textContent;
    titleEditResult.textContent = '';
    closeTitleEditForm();
  });

  titleEditForm.addEventListener('submit', async (event) => {
    event.preventDefault();
    const title = titleInput.value.trim();

    if (!title) {
      titleEditResult.textContent = '회의록 제목을 입력해 주세요.';
      return;
    }

    const submitButton = titleEditForm.querySelector('button[type="submit"]');
    submitButton.disabled = true;

    try {
      const response = await fetch(`/meetings/${meetingId}/title`, {
        method: 'PATCH',
        headers: {
          'Accept': 'application/json',
          'Content-Type': 'application/json',
          'X-Requested-With': 'XMLHttpRequest',
          [csrfHeader]: csrfToken
        },
        body: JSON.stringify({title})
      });
      const result = await response.json();

      if (!response.ok || !result.success) {
        titleEditResult.textContent = result.message || '회의록 제목 변경에 실패했습니다.';
        return;
      }

      meetingTitle.textContent = title;
      titleInput.value = title;
      titleEditResult.textContent = '회의록 제목을 변경했습니다.';
      closeTitleEditForm();
    } catch (error) {
      titleEditResult.textContent = '회의록 제목 변경 요청 중 오류가 발생했습니다.';
    } finally {
      submitButton.disabled = false;
    }
  });

  meetingDeleteButton.addEventListener('click', async () => {
    if (!window.confirm('정말 삭제하시겠습니까?')) {
      return;
    }

    meetingDeleteButton.disabled = true;
    meetingDeleteResult.textContent = '';

    try {
      const response = await fetch(`/meetings/${meetingId}`, {
        method: 'DELETE',
        headers: {
          'Accept': 'application/json',
          'X-Requested-With': 'XMLHttpRequest',
          [csrfHeader]: csrfToken
        }
      });
      const result = await response.json();

      if (!response.ok || !result.success) {
        meetingDeleteResult.textContent = result.message || '회의록 삭제에 실패했습니다.';
        return;
      }

      window.location.href = '/meetings';
    } catch (error) {
      meetingDeleteResult.textContent = '회의록 삭제 요청 중 오류가 발생했습니다.';
    } finally {
      meetingDeleteButton.disabled = false;
    }
  });

  function bindActionItem(item) {
    const view = item.querySelector('.action-item-view');
    const editForm = item.querySelector('.action-item-edit-form');
    const resultElement = item.querySelector('.action-item-row-result');
    const editButton = item.querySelector('.action-item-edit-button');
    const deleteButton = item.querySelector('.action-item-delete-button');
    const select = item.querySelector('.action-item-status');
    const calendarButton = item.querySelector('.calendar-event-button');

    calendarButton.addEventListener('click', async () => {
      calendarButton.disabled = true;
      calendarButton.textContent = '등록 중...';
      resultElement.textContent = '';

      try {
        await requestJson(`/action-items/${item.dataset.actionItemId}/calendar`, {
          method: 'POST',
          headers: {
            'Accept': 'application/json',
            'X-Requested-With': 'XMLHttpRequest',
            [csrfHeader]: csrfToken
          }
        });
        calendarButton.textContent = '캘린더 등록 완료';
        resultElement.textContent = 'Google Calendar에 일정을 등록했습니다.';
      } catch (error) {
        calendarButton.disabled = false;
        calendarButton.textContent = '캘린더 등록';
        resultElement.textContent = error.message || '캘린더 일정 등록에 실패했습니다.';
      }
    });

    editButton.addEventListener('click', () => {
      view.hidden = true;
      editForm.hidden = false;
      resultElement.textContent = '';
      editForm.elements.task.focus();
    });

    editForm.querySelector('.action-item-edit-cancel').addEventListener('click', () => {
      editForm.hidden = true;
      view.hidden = false;
      resultElement.textContent = '';
    });

    editForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      const payload = actionItemPayload(editForm);

      if (!payload.task) {
        resultElement.textContent = '액션 아이템 내용을 입력해 주세요.';
        return;
      }

      const submitButton = editForm.querySelector('button[type="submit"]');
      submitButton.disabled = true;
      resultElement.textContent = '';

      try {
        await requestJson(`/action-items/${item.dataset.actionItemId}`, {
          method: 'PATCH',
          headers: {
            'Accept': 'application/json',
            'Content-Type': 'application/json',
            'X-Requested-With': 'XMLHttpRequest',
            [csrfHeader]: csrfToken
          },
          body: JSON.stringify(payload)
        });
        updateActionItemView(item, payload);
        editForm.hidden = true;
        view.hidden = false;
        resultElement.textContent = '액션 아이템을 수정했습니다.';
      } catch (error) {
        resultElement.textContent = error.message || '액션 아이템 수정에 실패했습니다.';
      } finally {
        submitButton.disabled = false;
      }
    });

    deleteButton.addEventListener('click', async () => {
      if (!window.confirm('이 액션 아이템을 삭제하시겠습니까?')) {
        return;
      }

      deleteButton.disabled = true;
      resultElement.textContent = '';

      try {
        await requestJson(`/action-items/${item.dataset.actionItemId}`, {
          method: 'DELETE',
          headers: {
            'Accept': 'application/json',
            'X-Requested-With': 'XMLHttpRequest',
            [csrfHeader]: csrfToken
          }
        });
        item.remove();
        updateEmptyState();
        actionItemResult.textContent = '액션 아이템을 삭제했습니다.';
      } catch (error) {
        resultElement.textContent = error.message || '액션 아이템 삭제에 실패했습니다.';
        deleteButton.disabled = false;
      }
    });

    select.addEventListener('change', async (event) => {
      const target = event.currentTarget;
      const previousStatus = target.dataset.previousStatus;
      target.disabled = true;
      resultElement.textContent = '';

      try {
        await requestJson(`/action-items/${target.dataset.actionItemId}/status`, {
          method: 'PATCH',
          headers: {
            'Accept': 'application/json',
            'Content-Type': 'application/json',
            'X-Requested-With': 'XMLHttpRequest',
            [csrfHeader]: csrfToken
          },
          body: JSON.stringify({status: target.value})
        });

        if (!response.ok) {
          throw new Error('액션 아이템 상태 변경에 실패했습니다.');
        }
        target.dataset.previousStatus = target.value;
      } catch (error) {
        target.value = previousStatus;
        resultElement.textContent = error.message || '액션 아이템 상태 변경에 실패했습니다.';
      } finally {
        target.disabled = false;
      }
    });
    select.dataset.previousStatus = select.value;
    }

  actionItemCreateButton.addEventListener('click', () => {
    actionItemCreateForm.hidden = false;
    actionItemCreateButton.hidden = true;
    actionItemResult.textContent = '';
    actionItemCreateForm.elements.task.focus();
  });

  actionItemCreateForm.querySelector('.action-item-create-cancel').addEventListener('click', () => {
    actionItemCreateForm.reset();
    actionItemCreateForm.hidden = true;
    actionItemCreateButton.hidden = false;
    actionItemResult.textContent = '';
  });

  actionItemCreateForm.addEventListener('submit', async (event) => {
    event.preventDefault();
    const payload = actionItemPayload(actionItemCreateForm);

    if (!payload.task) {
      actionItemResult.textContent = '액션 아이템 내용을 입력해 주세요.';
      return;
    }

    const submitButton = actionItemCreateForm.querySelector('button[type="submit"]');
    submitButton.disabled = true;
    actionItemResult.textContent = '';

    try {
      const actionItem = await requestJson(`/meetings/${meetingId}/action-items`, {
        method: 'POST',
        headers: {
          'Accept': 'application/json',
          'Content-Type': 'application/json',
          'X-Requested-With': 'XMLHttpRequest',
          [csrfHeader]: csrfToken
        },
        body: JSON.stringify(payload)
      });
      actionItemList.append(createActionItemElement(actionItem));
      actionItemCreateForm.reset();
      actionItemCreateForm.hidden = true;
      actionItemCreateButton.hidden = false;
      actionItemResult.textContent = '액션 아이템을 추가했습니다.';
      updateEmptyState();
    } catch (error) {
      actionItemResult.textContent = error.message || '액션 아이템 추가에 실패했습니다.';
    } finally {
      submitButton.disabled = false;
    }
  });

  document.querySelectorAll('.action-item').forEach((item) => {
    bindActionItem(item);
  });
</script>
</body>
</html>
