<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" th:href="@{/css/common.css}" />
  <title>회의록 업로드</title>
  <style>
    #drop-zone {
        border: 2px dashed #6c757d;
        display: block;
        margin: 1rem 0;
        padding: 2rem;
    }
  </style>
</head>
<body>
<div th:replace="~{layouts/default :: layout(~{::section})}">
  <section>
    <header>
      <a th:href="@{/meetings}">목록으로</a>
      <h1>회의록 업로드</h1>
    </header>

    <form id="upload-form" th:action="@{/meetings/upload}" method="post" enctype="multipart/form-data">
      <label>
        회의 제목
        <input type="text" name="title" required />
      </label>
      <label>
        회의록 소유 범위
        <select name="teamId">
          <option value="">개인 회의록</option>
          <option th:each="team : ${teams}"
                  th:value="${team.id}"
                  th:text="${team.name}">팀 이름</option>
        </select>
      </label>
      <label id="drop-zone">
        음성 파일을 끌어다 놓거나 선택하세요.
        <input id="file-input" type="file" name="file" accept=".mp3,.mp4,.wav,.m4a" required />
      </label>
      <button id="upload-button" type="submit">업로드</button>
    </form>
    <p id="upload-status" aria-live="polite"></p>

    <script>
      const form = document.getElementById('upload-form');
      const dropZone = document.getElementById('drop-zone');
      const fileInput = document.getElementById('file-input');
      const statusMessage = document.getElementById('upload-status');

      const uploadButton = document.getElementById('upload-button');

      function pollStatus(meetingId) {
          const poller = window.setInterval(async () => {
              try {
                  const result = await apiRequest(`/meetings/${meetingId}/status`);
                  const status = result.status;
                  statusMessage.textContent = `처리 상태: ${status}`;

              if (status === 'COMPLETED') {
                      window.clearInterval(poller);
                      window.location.href = `/meetings/${meetingId}`;
                  } else if (status === 'FAILED') {
                      window.clearInterval(poller);
                      statusMessage.textContent = '회의록 처리에 실패했습니다.';
                      uploadButton.disabled = false;
                  }
              } catch (error) {
                  window.clearInterval(poller);
                  statusMessage.textContent = error.message
                      || '회의록 처리 상태를 확인하지 못했습니다.';
                  uploadButton.disabled = false;
              }
          }, 5000);
      }

      dropZone.addEventListener('dragover', (event) => {
          event.preventDefault();
      });

      dropZone.addEventListener('drop', (event) => {
          event.preventDefault();
          fileInput.files = event.dataTransfer.files;
      });

      form.addEventListener('submit', async (event) => {
          event.preventDefault();
          uploadButton.disabled = true;
          statusMessage.textContent = '파일을 업로드하고 있습니다.';

          try {
              const result = await apiRequest(form.action, {
                  method: 'POST',
                  body: new FormData(form)
              });
              statusMessage.textContent = `처리 상태: ${result.status}`;
              pollStatus(result.meetingId);
          } catch (error) {
              statusMessage.textContent = error.message || '파일 업로드에 실패했습니다.';
              uploadButton.disabled = false;
          }
      });
    </script>
  </section>
</div>
</body>
</html>
