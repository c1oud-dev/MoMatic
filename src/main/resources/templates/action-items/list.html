<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" th:href="@{/css/common.css}" />
    <title>액션아이템 목록</title>
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />
    <style>
        .filter-tabs {
            display: flex;
            gap: 0.5rem;
            margin: 1rem 0;
        }
        .filter-tab {
            border: 1px solid #dee2e6;
            border-radius: 999px;
            color: inherit;
            display: inline-block;
            padding: 0.35rem 0.8rem;
            text-decoration: none;
        }
        .filter-tab.active {
            background: #0d6efd;
            border-color: #0d6efd;
            color: #fff;
        }
        .status-badge {
            border-radius: 999px;
            display: inline-block;
            padding: 0.2rem 0.6rem;
        }
        .status-todo {
            background: #fff3cd;
        }
        .status-in_progress {
            background: #cff4fc;
        }
        .status-done {
            background: #d1e7dd;
        }
    </style>
</head>
<body>
<div th:replace="~{layouts/default :: layout(~{::section})}">
    <section>
        <header>
            <h1>액션아이템 목록</h1>
            <a th:href="@{/meetings}">회의록 목록</a>
        </header>

        <p th:unless="${calendarAvailable}">
            Google Calendar 신규 일정 등록은 Pro 이상 플랜에서 사용할 수 있습니다.
            <a th:href="@{/plans}">플랜 확인</a>
        </p>

        <nav class="filter-tabs" aria-label="액션아이템 상태 필터">
            <a th:href="@{/action-items(sort='dueDate',page=0,size=${actionItems.size})}"
               th:classappend="${selectedStatus == null} ? ' active'"
               class="filter-tab">전체</a>
            <a th:each="status : ${statuses}"
               th:href="@{/action-items(status=${status},sort='dueDate',page=0,size=${actionItems.size})}"
               th:classappend="${selectedStatus == status} ? ' active'"
               th:text="${status}"
               class="filter-tab">TODO</a>
        </nav>

        <p>
            <a th:href="@{/action-items(status=${selectedStatus},sort='dueDate',page=0,size=${actionItems.size})}">마감일 기준 정렬</a>
        </p>

        <p th:if="${actionItems.empty}">조회된 액션아이템이 없습니다.</p>
        <table th:unless="${actionItems.empty}">
            <thead>
            <tr>
                <th>회의 제목</th>
                <th>내용</th>
                <th>담당자</th>
                <th>
                    <a th:href="@{/action-items(status=${selectedStatus},sort='dueDate',page=0,size=${actionItems.size})}">마감일</a>
                </th>
                <th>상태</th>
                <th>Google Calendar</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="actionItem : ${actionItems.content}">
                <td th:text="${actionItem.meetingTitle}">회의 제목</td>
                <td th:text="${actionItem.task}">액션아이템 내용</td>
                <td th:text="${actionItem.assignee}">담당자</td>
                <td th:text="${actionItem.dueDate != null} ? ${#temporals.format(actionItem.dueDate, 'yyyy-MM-dd')} : '-'">2026-07-10</td>
                <td>
          <span th:text="${actionItem.status}"
                th:class="|status-badge status-${#strings.toLowerCase(actionItem.status.name())}|">
            TODO
          </span>
                </td>
                <td>
                    <button class="calendar-event-button"
                            type="button"
                            th:data-action-item-id="${actionItem.id}"
                            th:disabled="${actionItem.calendarEventRegistered
                                || !calendarAvailable}"
                            th:text="${actionItem.calendarEventRegistered}
                                ? '등록 완료'
                                : (${calendarAvailable} ? '캘린더 등록' : 'Pro 이상 플랜 필요')">
                        캘린더 등록
                    </button>
                    <span class="calendar-event-result"
                          role="alert"
                          aria-live="polite"></span>
                </td>
            </tr>
            </tbody>
        </table>

        <nav th:if="${actionItems.totalPages > 1}" aria-label="액션아이템 페이지 이동">
            <a th:if="${actionItems.hasPrevious()}"
               th:href="@{/action-items(status=${selectedStatus},sort='dueDate',page=${actionItems.number - 1},size=${actionItems.size})}">이전</a>
            <span th:text="|${actionItems.number + 1} / ${actionItems.totalPages}|">1 / 1</span>
            <a th:if="${actionItems.hasNext()}"
               th:href="@{/action-items(status=${selectedStatus},sort='dueDate',page=${actionItems.number + 1},size=${actionItems.size})}">다음</a>
        </nav>
    </section>
</div>
<script>
    const csrfToken = document.querySelector('meta[name="_csrf"]').content;
    const csrfHeader = document.querySelector('meta[name="_csrf_header"]').content;

    document.querySelectorAll('.calendar-event-button').forEach((button) => {
        button.addEventListener('click', async () => {
            const resultElement = button.parentElement.querySelector('.calendar-event-result');
            button.disabled = true;
            button.textContent = '등록 중...';
            resultElement.textContent = '';

            try {
                const response = await fetch(
                    `/action-items/${button.dataset.actionItemId}/calendar`,
                    {
                        method: 'POST',
                        headers: {
                            'Accept': 'application/json',
                            'X-Requested-With': 'XMLHttpRequest',
                            [csrfHeader]: csrfToken
                        }
                    }
                );
                const result = await response.json();

                if (!response.ok || !result.success) {
                if (result.errorCode === 'CALENDAR_PLAN_REQUIRED') {
                        throw new Error(
                            '구독이 종료되어 캘린더 신규 등록이 제한됩니다. Pro 이상 플랜을 이용해 주세요.'
                        );
                    }
                    throw new Error(result.message || '캘린더 일정 등록에 실패했습니다.');
                }

                button.textContent = '등록 완료';
                resultElement.textContent = 'Google Calendar에 일정을 등록했습니다.';
            } catch (error) {
                button.disabled = false;
                button.textContent = '캘린더 등록';
                resultElement.textContent = error.message || '캘린더 일정 등록에 실패했습니다.';
            }
        });
    });
</script>
</body>
</html>
