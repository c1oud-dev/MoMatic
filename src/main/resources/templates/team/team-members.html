<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" th:href="@{/css/common.css}" />
  <title>팀 멤버 관리</title>
</head>
<body>
<div th:replace="~{layouts/default :: layout(~{::section})}">
  <section>
    <header>
      <a th:href="@{/teams/list}">팀 목록</a>
      <a th:href="@{/teams/{teamId}/dashboard(teamId=${team.id})}">팀 대시보드</a>
      <a th:href="@{/teams/{teamId}/meetings(teamId=${team.id})}">팀 회의록</a>
      <h1 th:text="|${team.name} 멤버 관리|">팀 멤버 관리</h1>
      <p th:text="|내 권한: ${requesterRole}|">내 권한: MEMBER</p>
    </header>

    <section>
      <h2>팀 설정</h2>
      <div th:if="${canManage}">
        <form id="team-name-form">
          <label for="team-name">팀 이름</label>
          <input id="team-name"
                 name="name"
                 type="text"
                 th:value="${team.name}"
                 required />
          <button type="submit">팀 이름 변경</button>
        </form>
        <p id="team-name-result" role="alert" aria-live="polite"></p>
      </div>
      <div>
        <button id="leave-team-button"
                type="button"
                th:disabled="${requesterRole == 'OWNER'}">팀 탈퇴</button>
        <p th:if="${requesterRole == 'OWNER'}">OWNER는 팀을 탈퇴할 수 없습니다.</p>
        <p id="leave-team-result" role="alert" aria-live="polite"></p>
      </div>
    </section>

    <section th:if="${canManage}">
      <h2>초대 링크 복사</h2>
      <form id="invite-form">
        <label>
          초대 이메일
          <input id="invite-email" type="email" required />
        </label>
        <button type="submit">초대 링크 생성 및 복사</button>
      </form>
      <p id="invite-result" aria-live="polite"></p>
    </section>

    <section>
      <h2>멤버 목록</h2>
      <table>
        <thead>
        <tr>
          <th>이름</th>
          <th>이메일</th>
          <th>권한</th>
          <th th:if="${canManage}">관리</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="member : ${members}" th:data-member-id="${member.id}">
          <td th:text="${member.name}">이름</td>
          <td th:text="${member.email}">member@example.com</td>
          <td>
            <span th:unless="${canManage}" th:text="${member.role}">MEMBER</span>
            <select th:if="${canManage}"
                    class="role-select"
                    th:disabled="${member.role == 'OWNER'}">
              <option value="OWNER" th:selected="${member.role == 'OWNER'}">OWNER</option>
              <option value="ADMIN" th:selected="${member.role == 'ADMIN'}">ADMIN</option>
              <option value="MEMBER" th:selected="${member.role == 'MEMBER'}">MEMBER</option>
            </select>
          </td>
          <td th:if="${canManage}">
            <button type="button"
                    class="role-update-button"
                    th:disabled="${member.role == 'OWNER'}">권한 변경</button>
            <button type="button"
                    class="remove-button"
                    th:disabled="${member.role == 'OWNER'}">추방</button>
          </td>
        </tr>
        </tbody>
      </table>
      <p id="member-result" aria-live="polite"></p>
    </section>

    <script th:inline="javascript">
      const teamId = /*[[${team.id}]]*/ 0;
      const teamNameForm = document.getElementById('team-name-form');
      const teamNameInput = document.getElementById('team-name');
      const teamNameResult = document.getElementById('team-name-result');
      const leaveTeamButton = document.getElementById('leave-team-button');
      const leaveTeamResult = document.getElementById('leave-team-result');
      const inviteForm = document.getElementById('invite-form');
      const inviteEmail = document.getElementById('invite-email');
      const inviteResult = document.getElementById('invite-result');
      const memberResult = document.getElementById('member-result');

      async function copyInviteLink(code) {
          const inviteLink = `${window.location.origin}/teams/invite-confirm?code=${code}`;
          await navigator.clipboard.writeText(inviteLink);
          inviteResult.textContent = `초대 링크를 복사했습니다: ${inviteLink}`;
      }

      if (teamNameForm) {
          teamNameForm.addEventListener('submit', async (event) => {
              event.preventDefault();
              const name = teamNameInput.value.trim();

              try {
                  await apiRequest(`/teams/${teamId}/name`, {
                      method: 'PATCH',
                      json: {name}
                  });

                  document.querySelector('header h1').textContent = `${name} 멤버 관리`;
                  teamNameInput.value = name;
                  teamNameResult.textContent = '팀 이름을 변경했습니다.';
              } catch (error) {
                  teamNameResult.textContent = error.message || '팀 이름 변경에 실패했습니다.';
              }
          });
      }

      leaveTeamButton.addEventListener('click', async () => {
          if (!window.confirm('정말 팀에서 탈퇴하시겠습니까?')) {
              return;
          }

          try {
              await apiRequest(`/teams/${teamId}/leave`, {
                  method: 'DELETE'
              });

              window.location.href = '/teams/list';
          } catch (error) {
              leaveTeamResult.textContent = error.message || '팀 탈퇴에 실패했습니다.';
          }
      });

      inviteForm?.addEventListener('submit', async (event) => {
          event.preventDefault();
          try {
              const invite = await apiRequest(`/teams/${teamId}/invites`, {
                  method: 'POST',
                  json: {email: inviteEmail.value}
              });
              await copyInviteLink(invite.code);
          } catch (error) {
              inviteResult.textContent = error.message || '초대 링크 생성에 실패했습니다.';
          }
      });

      document.querySelectorAll('.role-update-button').forEach((button) => {
          button.addEventListener('click', async () => {
              const row = button.closest('tr');
              const memberId = row.dataset.memberId;
              const role = row.querySelector('.role-select').value;
              try {
                  await apiRequest(`/teams/${teamId}/members/${memberId}/role`, {
                      method: 'PATCH',
                      json: {role}
                  });
                  memberResult.textContent = '권한을 변경했습니다.';
              } catch (error) {
                  memberResult.textContent = error.message || '권한 변경에 실패했습니다.';
              }
          });
      });

      document.querySelectorAll('.remove-button').forEach((button) => {
          button.addEventListener('click', async () => {
              const row = button.closest('tr');
              const memberId = row.dataset.memberId;
              try {
                  await apiRequest(`/teams/${teamId}/members/${memberId}`, {
                      method: 'DELETE'
                  });
                  row.remove();
                  memberResult.textContent = '멤버를 추방했습니다.';
              } catch (error) {
                  memberResult.textContent = error.message || '멤버 추방에 실패했습니다.';
              }
          });
      });
    </script>
  </section>
</div>
</body>
</html>
